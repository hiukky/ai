# This project's agent environment. UZE reads this file and writes
# agents.lock from it — edit this one; the lock regenerates.

workspace:
  # No isolation: every agent starts in the primary checkout and commits
  # straight onto main. A worktree only exists if someone moves an agent
  # into one by hand ("To worktree").
  worktree: manual

  # The branch finished work targets.
  target: main

  # An agent that was moved into a worktree is delivered by fast-forwarding
  # main locally — the same place a non-isolated agent commits to.
  delivery: merge
