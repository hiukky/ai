# The quality gate. lefthook.yml runs the fast half of it before a commit;
# this runs all of it on every push and pull request, so a skipped hook is
# still caught here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every Python tool is pinned in requirements-dev.txt; this is the one line
  # that installs them, so CI and lefthook cannot drift apart.
  DEV_TOOLS: uv run --no-project --with-requirements requirements-dev.txt --

jobs:
  python:
    name: Python lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: $DEV_TOOLS ruff format --check
      - run: $DEV_TOOLS ruff check --output-format github
      - run: $DEV_TOOLS python .github/scripts/typecheck.py

  # The scripts run wherever their harness does (AGENTS.md: Windows
  # included), so each one must at least import and parse its arguments on
  # every platform, from the version floor in ruff.toml to the newest.
  smoke:
    name: Scripts start (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: --help on every skill script
        shell: bash
        run: |
          status=0
          for script in */skills/*/scripts/*; do
            [ -f "$script" ] || continue
            case "$(basename "$script")" in _*|.*) continue ;; esac
            if python -I "$script" --help > /dev/null; then
              echo "ok    $script"
            else
              echo "FAIL  $script"
              status=1
            fi
          done
          exit $status

  marketplace:
    name: Marketplace and plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uze
        env:
          UZE_VERSION: 1.0.0-beta.15
          UZE_BIN_DIR: ${{ runner.temp }}/uze/bin
        run: |
          curl -fsSL https://uze.sh/i | sh
          echo "$UZE_BIN_DIR" >> "$GITHUB_PATH"
      - run: uze agent market check .
      - name: Check each plugin in marketplace.json
        run: |
          for plugin in $(jq -r '.plugins[].source' marketplace.json); do
            uze agent plugin check "$plugin"
          done

  web:
    name: Docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      # The catalog is generated from the repository and committed; a plugin
      # change pushed without regenerating it leaves the site out of date.
      - name: Catalog is up to date
        run: |
          bun run catalog
          git diff --exit-code -- lib/catalog.json
      - run: bun run types:check
      - run: bun run build
