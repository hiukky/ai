# Type checking for the Python a skill ships. Run through
# .github/scripts/typecheck.py, which checks each script on its own: a file
# without a `.py` extension is module `__main__` to mypy, so two of them in
# one run collide.
[mypy]
python_version = 3.11
warn_unused_ignores = True
warn_redundant_casts = True
# PyYAML is optional at runtime (tui-record falls back to TOML) and carries
# no stubs here.
ignore_missing_imports = True
